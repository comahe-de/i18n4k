# Kotlin/Native Windows console app of the example.

product: windows/app

settings:
  native:
    # The Toolchain's default entry point is `main` in the root package. These
    # apps use a package, so the fully qualified function is configured here.
    entryPoint: example.windowsapp.main
  kotlin:
    version: 2.3.20

dependencies:
  - //shared

# Kotlin/JS browser app of the example.
#
# Note: the `js/app` product type is an incomplete preview in Kotlin Toolchain
# 0.14.1. The module is compiled, but the CLI neither links a runnable `.mjs`
# nor runs it. See the README.

product: js/app

settings:
  kotlin:
    version: 2.3.20

settings@js:
  kotlin:
    freeCompilerArgs:
      - -Xir-module-name=example-mpp-js-app

dependencies:
  - //shared

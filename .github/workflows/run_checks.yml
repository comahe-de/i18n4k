name: Run checks

on:
    push:
        branches:
            - "*"
    pull_request:
        branches:
            - "**"

jobs:
  run-checks:
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
          include:
            # Use the platform-specific Kotlin Toolchain wrapper: the shell
            # wrapper does not work in the default PowerShell on Windows.
            - os: ubuntu-latest
              kotlin: ./kotlin
              exampleNativeApp: linux-app
            - os: windows-latest
              kotlin: ./kotlin.bat
              exampleNativeApp: windows-app
            - os: macos-latest
              kotlin: ./kotlin
              exampleNativeApp: macos-app
    env:
        KOTLIN_CLI_NO_WELCOME_BANNER: "1"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'corretto'
        java-version: '21'
    - name: Cache Kotlin Toolchain stuff
      if: ${{ always() }}
      uses: actions/cache@v4
      with:
        path: |
            ~/.cache/JetBrains/Kotlin/cli
            ~/Library/Caches/JetBrains/Kotlin/cli
            ~/AppData/Local/JetBrains/Kotlin/cli
        key: ${{ runner.os }}-kotlin-toolchain-${{ hashFiles('kotlin', 'kotlin.bat') }}
        restore-keys: |
            ${{ runner.os }}-kotlin-toolchain-
    # The Gradle plugin and the examples are still Gradle builds, so they need
    # the Gradle cache in addition to the Kotlin Toolchain one.
    - name: Cache Gradle stuff
      if: ${{ always() }}
      uses: actions/cache@v4
      with:
        path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
            ${{ runner.os }}-gradle-
    - name: Cache Konan stuff
      if: ${{ always() }}
      uses: actions/cache@v4
      with:
        path: |
            ~/.konan/
        key: ${{ runner.os }}-konan-${{ hashFiles('kotlin', 'kotlin.bat') }}
        restore-keys: |
            ${{ runner.os }}-konan-
    - name: Permission to run wrappers
      if: runner.os != 'Windows'
      run: chmod +x ./kotlin
        && chmod +x ./i18n4k-gradle-plugin/gradlew
        && chmod +x ./examples-kotlin-toolchain/example-mpp/kotlin
        && chmod +x ./examples-kotlin-toolchain/example-compose/kotlin
        && chmod +x ./examples/example-jvm/gradlew
        && chmod +x ./examples/example-mpp/gradlew
        && chmod +x ./examples/example-android/gradlew
        && chmod +x ./examples/example-android-agp8/gradlew
        && chmod +x ./examples/example-compose/gradlew
    - name: Kotlin Toolchain version infos
      run: ${{ matrix.kotlin }} --version
    # **Android SDK license workaround (Windows)**
    # Some packages shipped by the Windows runner image (`platforms`,
    # `build-tools`) have a `package.xml` that references a legacy license id
    # (e.g. `license-2802B623`, `license-2AB95129`) for which no accepted
    # license file exists under `<sdk>/licenses`. The Kotlin Toolchain and the
    # Android Gradle plugin then abort with "Some licenses have not been
    # accepted in the Android SDK". `sdkmanager --licenses` only accepts the
    # licenses of *remote* packages, so it cannot create those files.
    #
    # Accept the licenses of the installed packages in place instead of
    # deleting them: the later Gradle builds use exactly the package versions
    # from the runner image (e.g. `build-tools;37.0.0`, platform `android-36`).
    # For every missing `<id>` license file, write the accepted hashes from
    # `licenses/android-sdk-license` plus the hashes of the package's own
    # license text.
    - name: Accept installed Android SDK licenses (Linux/macOS)
      if: ${{ always() && runner.os != 'Windows' }}
      shell: bash
      run: |
        if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
          python3 - "$ANDROID_SDK_ROOT" <<'PY'
        import hashlib, os, re, sys

        sdk = sys.argv[1]
        lic_dir = os.path.join(sdk, "licenses")
        if not os.path.isdir(lic_dir):
            sys.exit(0)

        standard = os.path.join(lic_dir, "android-sdk-license")
        standard_hashes = []
        if os.path.isfile(standard):
            with open(standard, encoding="utf-8") as f:
                standard_hashes = [line.strip() for line in f if line.strip()]

        for kind in ("platforms", "build-tools"):
            root = os.path.join(sdk, kind)
            if not os.path.isdir(root):
                continue
            for name in sorted(os.listdir(root)):
                manifest = os.path.join(root, name, "package.xml")
                if not os.path.isfile(manifest):
                    continue
                with open(manifest, "rb") as f:
                    raw = f.read()
                licenses = {}
                for m in re.finditer(rb'<license\s+id="([^"]+)"[^>]*>(.*?)</license>', raw, re.S):
                    licenses[m.group(1).decode()] = m.group(2)
                for m in re.finditer(rb'uses-license\s+ref="([^"]+)"', raw):
                    ref = m.group(1).decode()
                    path = os.path.join(lic_dir, ref)
                    if os.path.exists(path):
                        continue
                    hashes = list(standard_hashes)
                    text = licenses.get(ref)
                    if text is not None:
                        hashes.append(hashlib.sha1(text).hexdigest())
                        hashes.append(hashlib.sha1(text.replace(b"\r\n", b"\n")).hexdigest())
                    unique = list(dict.fromkeys(hashes))
                    if not unique:
                        print(f"WARNING: no accepted license hash for '{ref}' ({kind}/{name})")
                        continue
                    with open(path, "w", encoding="utf-8", newline="\n") as f:
                        f.write("\n".join(unique) + "\n")
                    print(f"Accepted license '{ref}' for {kind}/{name}")
        PY
        fi
    - name: Accept installed Android SDK licenses (Windows)
      if: ${{ always() && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        if ($env:ANDROID_SDK_ROOT) {
          $sdk = $env:ANDROID_SDK_ROOT
          $licDir = Join-Path $sdk 'licenses'
          if (Test-Path $licDir) {
            $standard = Join-Path $licDir 'android-sdk-license'
            $standardHashes = @()
            if (Test-Path $standard) {
              $standardHashes = Get-Content -LiteralPath $standard | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() }
            }
            foreach ($kind in @('platforms', 'build-tools')) {
              $dir = Join-Path $sdk $kind
              if (-not (Test-Path $dir)) { continue }
              Get-ChildItem -LiteralPath $dir -Directory | ForEach-Object {
                $pkg = $_.FullName
                $manifest = Join-Path $pkg 'package.xml'
                if (-not (Test-Path $manifest)) { return }
                $raw = Get-Content -Raw -LiteralPath $manifest
                $licenses = @{}
                foreach ($m in [regex]::Matches($raw, '(?s)<license\s+id="([^"]+)"[^>]*>(.*?)</license>')) {
                  $licenses[$m.Groups[1].Value] = $m.Groups[2].Value
                }
                foreach ($m in [regex]::Matches($raw, 'uses-license\s+ref="([^"]+)"')) {
                  $ref = $m.Groups[1].Value
                  $path = Join-Path $licDir $ref
                  if (Test-Path $path) { continue }
                  $hashes = New-Object System.Collections.Generic.List[string]
                  foreach ($h in $standardHashes) { $hashes.Add($h) }
                  if ($licenses.ContainsKey($ref)) {
                    $text = $licenses[$ref]
                    foreach ($value in @($text, ($text -replace "`r`n", "`n"))) {
                      $sha = [System.Security.Cryptography.SHA1]::Create()
                      $hashes.Add((-join ($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($value)) | ForEach-Object { $_.ToString('x2') })))
                    }
                  }
                  $unique = $hashes | Select-Object -Unique
                  if (-not $unique) {
                    Write-Host "WARNING: no accepted license hash for '$ref' ($kind/$($_.Name))"
                    return
                  }
                  $unique | Set-Content -LiteralPath $path -Encoding ascii
                  Write-Host "Accepted license '$ref' for $kind/$($_.Name)"
                }
              }
            }
          }
        }
    - name: Install to local maven
      run: ${{ matrix.kotlin }} publish mavenLocal
    - name: Run tests
      run: ${{ matrix.kotlin }} test
    - name: Build everything
      run: ${{ matrix.kotlin }} build
    # The Kotlin Toolchain example is a standalone project, like the Gradle
    # examples below. It consumes the artifacts published to Maven Local above.
    - name: Build the Kotlin Toolchain example project
      if: ${{ always() }}
      working-directory: ./examples-kotlin-toolchain/example-mpp
      run: ${{ matrix.kotlin }} build
    - name: Test the Kotlin Toolchain example project
      if: ${{ always() }}
      working-directory: ./examples-kotlin-toolchain/example-mpp
      run: ${{ matrix.kotlin }} test
    - name: Run the Kotlin Toolchain example (native)
      if: ${{ always() }}
      working-directory: ./examples-kotlin-toolchain/example-mpp
      run: ${{ matrix.kotlin }} run -m ${{ matrix.exampleNativeApp }}
    # Compose Multiplatform example. The apps are built, but not launched: the
    # desktop/web apps block, and Android/iOS need a device/emulator or Xcode.
    - name: Build the Kotlin Toolchain Compose example
      if: ${{ always() }}
      working-directory: ./examples-kotlin-toolchain/example-compose
      run: ${{ matrix.kotlin }} build
    - name: Test the Kotlin Toolchain Compose example
      if: ${{ always() }}
      working-directory: ./examples-kotlin-toolchain/example-compose
      run: ${{ matrix.kotlin }} test -m shared -p jvm
    - name: Build the Gradle plugin (nested Gradle build)
      if: ${{ always() }}
      shell: bash
      working-directory: ./i18n4k-gradle-plugin
      run: ./gradlew build
    - name: Build Compose-Multiplatform example
      # Build hangs on Linux. Why????
      if: runner.os != 'Linux'
      shell: bash
      working-directory: ./examples/example-compose
      run: ./gradlew build
    - name: Build JVM example
      if: ${{ always() }}
      shell: bash
      working-directory: ./examples/example-jvm
      run: ./gradlew build
    - name: Build MPP example
      if: ${{ always() }}
      shell: bash
      working-directory: ./examples/example-mpp
      run: ./gradlew build
    - name: Build Android example
      if: ${{ always() }}
      shell: bash
      working-directory: ./examples/example-android
      run: ./gradlew build
    - name: Build Android AGP8 example
      if: ${{ always() }}
      shell: bash
      working-directory: ./examples/example-android-agp8
      run: ./gradlew build
    # Stop Gradle daemons to free locks on cache files.
    # https://github.com/actions/setup-java/issues/633#issuecomment-2219579714
    - name: Stop Gradle daemons
      shell: bash
      run: |
        ./i18n4k-gradle-plugin/gradlew --stop
        ./examples/example-jvm/gradlew  --stop
        ./examples/example-mpp/gradlew  --stop
        ./examples/example-android/gradlew  --stop
        ./examples/example-android-agp8/gradlew  --stop
        ./examples/example-compose/gradlew  --stop
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: test-reports-${{ matrix.os }}
        path: |
            build/reports/
            examples-kotlin-toolchain/example-mpp/build/reports/
            examples-kotlin-toolchain/example-compose/build/reports/
            i18n4k-gradle-plugin/build/test-results/
            examples/example-jvm/build/test-results/
            examples/example-mmp/build/test-results/
            examples/example-android/build/test-results/
            examples/example-android-agp8/build/test-results/
            examples/example-compose/build/test-results/

name: Release checks (on Windows)

on:
  push:
    tags:
    - 'v*.*.*'
    - 'v*.*.*-*'

jobs:
  release-checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]

    env:
        KOTLIN_CLI_NO_WELCOME_BANNER: "1"

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'corretto'
        java-version: '21'

    # don't use cache for releases...

    # Maven Central publication happens once, from the macOS workflow: the
    # Toolchain publishes every platform from a single host, so publishing from
    # several hosts would upload duplicate artifacts.
    - name: Run test
      run: ./kotlin.bat test

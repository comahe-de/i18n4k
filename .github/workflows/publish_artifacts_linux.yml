name: Release checks + Gradle plugin publish (on Linux)

on:
  push:
    tags:
    - 'v*.*.*'
    - 'v*.*.*-*'

jobs:
  release-checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    env:
        KOTLIN_CLI_NO_WELCOME_BANNER: "1"

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'corretto'
        java-version: '21'

    # don't use cache for releases...

    - name: Run test
      run: chmod +x ./kotlin && ./kotlin test

    # The libraries are published to Maven Central from the macOS workflow.
    # This job only needs them in Maven Local to build the Gradle plugin.
    - name: Install to local maven
      run: ./kotlin publish mavenLocal

    - name: Publish Gradle plugin to the Gradle Plugin Portal
      run: |
        chmod +x ./i18n4k-gradle-plugin/gradlew
        cd ./i18n4k-gradle-plugin
        ./gradlew publishPlugins
